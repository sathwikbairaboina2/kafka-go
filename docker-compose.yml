name: kafka-go
services:
  kgod:
    build: .
    image: kafka-go/kgod:dev
    container_name: kafka-go-kgod
    command: ["--listen", ":9092", "--advertise", "${KGOD_ADVERTISE:-kafka-go-kgod:9092}", "--data-dir", "/data",
              "--fsync", "${KGOD_FSYNC:-interval}", "--topic", "demo:3", "--topic", "compat-kcat:3", "--topic", "bench:8"]
    ports: ["${KGOD_PORT:-5380}:9092"]
    volumes: ["kgod-data:/data"]
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-go-kafka
    profiles: ["bench"]
    ports: ["${KAFKA_PORT:-5382}:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-go-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "8"
volumes:
  kgod-data:
